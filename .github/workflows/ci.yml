---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Format
        run: nix develop --command treefmt --fail-on-change

  api:
    name: API crate
    needs:
      - formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Clippy
        run: |
          set -x
          cd ./api
          nix develop --command cargo clippy -- -Dwarnings

      - name: Tests
        run: |
          set -x
          cd ./api
          nix develop --command cargo test

  firmware:
    name: Firmware
    needs:
      - api
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Clippy
        run: |
          set -x
          cd ./firmware
          nix develop --command just clippy

      - name: Build
        run: |
          set -x
          cd ./firmware
          nix develop --command just

  cli:
    name: CLI
    needs:
      - api
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Clippy
        run: |
          set -x
          cd ./cli
          nix develop --command cargo clippy -- -Dwarnings

      - name: Tests
        run: |
          set -x
          cd ./web
          nix develop --command cargo test

      - name: Build
        run: |
          set -x
          cd ./cli
          nix develop --command cargo build --release

  web:
    name: Web
    needs:
      - api
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Clippy
        run: |
          set -x
          cd ./web
          nix develop --command cargo clippy -- -Dwarnings

      - name: Tests
        run: |
          set -x
          cd ./web
          nix develop --command just test

      - name: Build
        run: |
          set -x
          cd ./web
          nix develop --command just

  web-deploy:
    name: Deploy web UI
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - web
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build
        run: |
          set -x
          cd ./web
          nix develop --command just

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
