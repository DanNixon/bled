---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Check
        run: nix develop --command just check

      - name: Build
        run: nix develop --command just build

      - name: Generate size report
        if: github.event_name == 'pull_request'
        run: nix develop --command just size-report > size-report.md

      - name: Comment size report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bled-size-report -->';
            const report = fs.readFileSync('size-report.md', 'utf8').trim();
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;

            const body = [
              marker,
              '## 📦 Build Size Report',
              '',
              `Commit: [\`${shortSha}\`](${commitUrl})`,
              '',
              report,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  web-deploy:
    name: Deploy web UI
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build
        run: |
          set -x
          cd ./web
          nix develop --command just build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web/app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
