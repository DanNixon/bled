[package]
name = "bled-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unused_crate_dependencies = "deny"

[dependencies]
bled-core = { path = "../lib/core" }
heapless = "0.9"
js-sys = "0.3"
git-version = "0.3.9"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
teeny-rpc = { version = "0.3.0", default-features = false, features = ["no-std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
teeny-rpc = { version = "0.3.0", default-features = false, features = ["std"] }
