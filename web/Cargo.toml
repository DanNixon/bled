[package]
name = "bled-web"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bled-core = { path = "../lib/core" }
chrono = { version = "0.4.45", default-features = false }
futures = "0.3"
git-version = "0.3.9"
heapless = "0.9"
js-sys = "0.3"
leptodon = { version = "1.7.0", default-features = false, features = ["csr"] }
leptos = { version = "0.8.21", default-features = false, features = ["csr", "tracing"] }
send_wrapper = "0.6.0"
teeny-rpc = { version = "0.3.0", default-features = false, features = ["no-std"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "=0.3.104", features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "Document",
    "Event",
    "File",
    "FileList",
    "FocusEvent",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Url",
    "Window",
] }

[build-dependencies]
leptodon = { version = "1.7.0", default-features = false, features = ["csr"] }

[dev-dependencies]
serde_json = "1.0"
