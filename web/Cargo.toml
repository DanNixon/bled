[package]
name = "bled-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unused_crate_dependencies = "deny"

[dependencies]
bled-api = { path = "../api" }
git-version = "0.3.9"
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
