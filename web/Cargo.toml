[package]
name = "bled-web"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bled-core = { path = "../lib/core" }
chrono = { version = "0.4.45", default-features = false }
futures = "0.3"
git-version = "0.3.9"
heapless = "0.9"
iced = { version = "0.14.0", default-features = false, features = [
    "tiny-skia",
    "crisp",
    "web-colors",
    "fira-sans",
    "thread-pool",
    "x11",
    "wayland",
] }
js-sys = "0.3"
send_wrapper = { version = "0.6.0", features = ["futures"] }
teeny-rpc = { version = "0.3.0", default-features = false, features = ["no-std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "Document",
    "Event",
    "File",
    "FileList",
    "FocusEvent",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Url",
    "Window",
] }

[dev-dependencies]
serde_json = "1.0"
